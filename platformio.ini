; PlatformIO project for mysmall-tv
; One board: GeekMagic SmallTV Pro, classic ESP32, 8 MB flash, 1.54" 240x240
; ST7789 IPS display.
;
; Build:           ./build.sh   (PlatformIO in Docker, nothing installed on the host)
; Build artifact:  dist/smalltv_esp32_8mb/firmware.bin
; Flash via OTA:   ./install.sh <device-ip>, or upload firmware.bin through the
;                  device web UI (System tab)
;
; License: WTFPL

[platformio]
default_envs = smalltv_esp32_8mb

; ---------------------------------------------------------------------------
; GeekMagic SmallTV Pro: classic ESP32 (esp32dev), 8 MB flash, ST7789V panel
; (pin map in src/board_esp32_pro.h). The partition layout is the stock SmallTV
; Pro one (2.125 MB per OTA app slot + ~3.7 MB LittleFS, see
; partitions/smalltv_8mb_ota.csv), so OTA offsets match the stock firmware and
; firmware.bin installs through the stock web UI's /update.
; SMALLTV_ESP32 selects the chip-family code paths, SMALLTV_ESP32_PRO the board.
; No USB-serial chip (USB-C is power only). Recovery from an image that does
; not boot: wire a 3.3 V UART adapter to the internal header and flash
; firmware.factory.bin at 0x0.
; ---------------------------------------------------------------------------
[env:smalltv_esp32_8mb]
; pioarduino fork of the Espressif platform (Arduino core 3.x / ESP-IDF 5.x).
; Pinned exactly: 55.03.311 works with PlatformIO Core 6.1.19 (docker/Dockerfile);
; newer releases require Core >= 6.2.0. Lift both pins together.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino

; esp32dev defaults to 4 MB; override for the 8 MB module.
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

board_build.filesystem = littlefs
board_build.partitions = partitions/smalltv_8mb_ota.csv

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; WITH_USAGE / WITH_RADAR / WITH_HA switch whole features off; their code stays
; in src/features and comes back by removing the flag.
;
; SMALLTV_WIREGUARD compiles the optional WireGuard client (src/WgClient.cpp).
; The two peer limits are compile-time: esp_wireguard allocates peers statically
; inside its device struct and both default to 1. MAX_SRC_IPS has to cover every
; allowed-IPs entry plus the device's own address, which the component adds
; itself. These must be build_flags, not build_src_flags, because they have to
; reach the library's own translation units.
;
; The last four flags shrink the image. They reach everything PlatformIO
; compiles here: src/, the lib_deps and the Arduino core and libraries. The
; prebuilt ESP-IDF libraries are not affected.
;   CORE_DEBUG_LEVEL=0 compiles out the Arduino core's log_e() and friends,
;     serial-console diagnostics only. The firmware's own Serial output stays.
;   -fno-exceptions and the two unwind-table flags drop the C++ landing pads,
;     .gcc_except_table and .eh_frame. Nothing in this build catches an
;     exception, so a throw from the prebuilt libstdc++ (std::bad_alloc out of
;     a growing std::string) ends in std::terminate and a reboot either way.
build_flags =
	-D SMALLTV_ESP32
	-D SMALLTV_ESP32_PRO
	-D ARDUINOJSON_USE_DOUBLE=0
	-D WITH_USAGE=0
	-D WITH_RADAR=0
	-D WITH_HA=0
	-D SMALLTV_WIREGUARD=1
	-D CONFIG_WIREGUARD_MAX_PEERS=1
	-D CONFIG_WIREGUARD_MAX_SRC_IPS=5
	; PubSubClient receive buffer.
	-D MQTT_MAX_PACKET_SIZE=2048
	-D CORE_DEBUG_LEVEL=0
	-fno-exceptions
	-fno-asynchronous-unwind-tables
	-fno-unwind-tables

; Feature folders on the include path so cross-module quote-includes resolve.
; These MUST be build_src_flags (project sources only), not build_flags: a global
; -Isrc leaks into the framework build and shadows internal ESP-IDF headers
; like net.h/config.h, breaking the build.
build_src_flags =
	-iquote src
	-iquote src/features/ticker
	-iquote src/features/usage
	-iquote src/features/radar
	-iquote src/features/notify
	-iquote src/features/ha

; Pinned exactly, like the platform: a library release goes into every image
; and out over OTA, so a version change is a reviewed commit, not whatever the
; registry serves on the day of the build.
lib_deps =
	; 7.3 or newer: ThemeCatalog.h relies on JsonString(text, true) keeping
	; only a pointer; 7.2 reads that `true` as a length of 1.
	bblanchon/ArduinoJson @ 7.4.3
	moononournation/GFX Library for Arduino @ 1.6.9
	knolleary/PubSubClient @ 2.8.0
	; WireGuard client. Pinned exactly: 0.4.3/0.4.4 were crypto-backend changes,
	; and this ships over OTA.
	droscy/esp_wireguard @ 0.4.5
